<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %} insta {% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-white">
  <nav class="navbar fixed-top bg-white border-bottom">
    <div class="container page-narrow">
      <a class="navbar-brand fw-bold" href="/posts">insta</a>

      <div class="d-flex align-items-center gap-3">
        <!-- <a class="link-body-emphasis link-underline-opacity-0" href="/posts">전체 글</a> -->

        {% if user %}
        <!-- 로그인 한 경우 -->
          <a href="/posts/new">
            <img src="/static/new-post.png" class="nav-icon" alt="글 작성">
          </a>
          <!-- <span class="navbar-text text-body-secondary">{{ user.username }} 님, 반갑습니다!</span> -->
          <a class="link-body-emphasis link-underline-opacity-0" href="/users/{{ user.username }}">
            {% if user.avatar_url != None %}
            <img class="rounded-circle" src="/{{user.avatar_url}}"  alt="프로필 이미지" width="50" height="50">
            {% else %}
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle text-bg-secondary bg-gradient fw-semibold"
                 style="width: 50px; height: 50px;">{{user.username}}</div>
            {% endif %}
          </a>
          <form action="/logout" method="post">
            <input class="btn btn-sm btn-outline-secondary" type="submit" value="로그아웃">
          </form>
        {% else %}
        <!-- 로그인 하지 않은 경우 -->
          <a class="link-body-emphasis link-underline-opacity-0" href="/signup">회원가입</a>
          <a class="link-body-emphasis link-underline-opacity-0" href="/login">로그인</a>
        {% endif %}
      </div>

    </div>
  </nav>
  <main class="container page-narrow py-4">
    {% block content %} {% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
