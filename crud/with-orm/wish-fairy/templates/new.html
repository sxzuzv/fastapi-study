<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wish Fairy</title>
</head>
<body>
    <h1>요정 프로필 등록</h1>
    <form action="/fairies/create" method="post">
        <ul>
            <li>이름: <input type="text" name="name" required></li>
            <li>닉네임: <input type="text" name="nickname" required></li>
            <li>생년월일: <input type="date" name="birth_date" required></li>
        </ul>
        <input type="submit" value="등록하기">
    </form>
</body>
</html>
